name: Update Protein Prices

on:
  schedule:
    # Runs daily at 04:00 UTC (06:00 SAST - South African Standard Time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Retailer catalog to update'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - takealot
          - dischem
          - clicks
          - nutritech

permissions:
  contents: write
  issues: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Updater & Consolidation
        run: |
          python updater.py --retailer ${{ github.event.inputs.retailer || 'all' }}

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --staged --quiet; then
            echo "No price or catalog changes detected. Everything is current."
          else
            git commit -m "Automated price & catalog update [skip ci]"
            git push
          fi

      - name: Alert on Failure (Create GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Automated Price Update Failed (${new Date().toLocaleDateString('en-ZA')})`,
              body: `### Automated Workflow Run Failed\n\nThe price updater encountered an error.\n\n- **Trigger:** \`${context.eventName}\`\n- **Run Details & Logs:** [View Run #${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\nCheck the log output of the failing step to diagnose the issue.`
            });

